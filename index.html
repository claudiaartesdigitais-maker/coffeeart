<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu CoffeArt - Embu das Artes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --cafe-dark: #755437; 
            --cafe-light: #fff4e6; 
            --accent: #be9b7b; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--cafe-light);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER ESTILO LINKTREE */
        header { 
            text-align: center; 
            padding: 30px 20px; 
            width: 100%;
            max-width: 600px;
        }

        .logo-img { 
            max-width: 100px; 
            height: auto; 
            border-radius: 50%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 { 
            font-size: 1.2rem; 
            color: var(--cafe-dark); 
            letter-spacing: 1px; 
            text-transform: uppercase;
            margin: 0;
        }

        /* CONTAINER DOS BOTÕES */
        .links-container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ESTILO DOS BOTÕES (IGUAL AO SITE DE REFERÊNCIA) */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background-color: white;
            color: var(--cafe-dark);
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(117, 84, 55, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-link:active {
            transform: scale(0.98);
            background-color: #fcfcfc;
        }

        .btn-link i {
            margin-right: 15px;
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        /* BOTÃO DE DESTAQUE (WHATSAPP/PEDIDO) */
        .btn-pedido {
            background-color: var(--cafe-dark);
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <img src="./Logotipo.png" alt="Logo CoffeArt" class="logo-img">
    <h1>CoffeeArt - Embu das Artes</h1>
</header>

<div class="links-container">
    <a href="https://cardapiocoffeeartes.pedidoon.net" class="btn-link btn-pedido" target="_blank">
        <i class="fab fa-whatsapp"></i> Faça seu Pedido Online
    </a>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-coffee"></i> Cafés Arábica
    </div>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-mug-hot"></i> Bebidas Quentes
    </div>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-ice-cream"></i> Bebidas Geladas
    </div>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-utensils"></i> Salgados
    </div>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-cookie"></i> Doces & Sobremesas
    </div>

    <div class="btn-link" onclick="window.open('https://cardapiocoffeeartes.pedidoon.net', '_blank')">
        <i class="fas fa-gift"></i> Encomendas Especiais
    </div>
</div>

</body>
</html>
